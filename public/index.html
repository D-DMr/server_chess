<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Chess</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- MENU LATERAL (Fica sempre visível à esquerda) -->
    <aside class="sidebar">
        <div class="logo">♞ <span>Neon Chess</span></div>
        <nav class="nav-menu">
            <a href="#" class="nav-item active" onclick="showScreen('home-screen')"><span class="icon">♟</span> Jogar</a>
            <a href="#" class="nav-item"><span class="icon">🧩</span> Quebra-cabeças</a>
            <a href="#" class="nav-item"><span class="icon">🎓</span> Aprender</a>
            <a href="#" class="nav-item"><span class="icon">👁</span> Assistir</a>
        </nav>
    </aside>

    <!-- ÁREA PRINCIPAL (Muda consoante o ecrã) -->
    <main class="main-content">
        
        <!-- 1. Ecrã Inicial -->
        <div id="home-screen" class="screen active">
            <div class="hero">
                <h1>Jogue xadrez online no site #1!</h1>
                <p>Junta-te à comunidade e joga contra amigos ou contra a IA.</p>
                <div class="hero-buttons">
                    <button class="btn-main" onclick="startAI()">Jogar vs Computador</button>
                    <button class="btn-main secondary" onclick="showScreen('online-screen')">Jogar Online</button>
                </div>
            </div>
        </div>

        <!-- 2. Ecrã Online (Lobby) -->
        <div id="online-screen" class="screen">
            <div class="lobby-card">
                <h2>Jogar Online</h2>
                <div class="input-group">
                    <input type="text" id="player-name" placeholder="O teu nome">
                    <button class="btn-main" onclick="createRoom()">Criar Sala</button>
                </div>
                <div class="input-group" style="margin-top: 15px;">
                    <input type="text" id="join-code" placeholder="Código da sala">
                    <button class="btn-main secondary" onclick="joinRoom()">Entrar na Sala</button>
                </div>
                <button class="btn-text" onclick="showScreen('home-screen')">Voltar atrás</button>
            </div>
        </div>

        <!-- 3. Ecrã do Tabuleiro -->
        <div id="game-screen" class="screen">
            <div class="game-layout">
                <!-- Tabuleiro -->
                <div class="board-area">
                    <div class="player-bar">
                        <span id="opp-name">Oponente</span>
                        <div class="clock">10:00</div>
                    </div>
                    <div id="board"></div>
                    <div class="player-bar">
                        <span id="my-name">Tu</span>
                        <div class="clock active">10:00</div>
                    </div>
                </div>
                
                <!-- Painel de Movimentos -->
                <div class="history-panel">
                    <h3>Movimentos</h3>
                    <ul id="move-history"></ul>
                    <button class="btn-danger" onclick="location.reload()">Desistir</button>
                </div>
            </div>
        </div>

    </main>

    <script src="script.js"></script>
</body>
</html>
